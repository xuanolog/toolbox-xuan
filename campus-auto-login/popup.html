<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园网自动登录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>校园网登录</h1>
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span class="status-text">检测中...</span>
      </div>
    </div>

    <div class="form-group">
      <label for="accountSelect">账号配置</label>
      <div class="select-wrapper">
        <select id="accountSelect">
          <option value="">-- 请选择账号 --</option>
        </select>
        <button id="addAccountBtn" class="btn-icon" title="添加账号">+</button>
      </div>
    </div>

    <div class="form-group">
      <label for="ispSelect">运营商</label>
      <select id="ispSelect">
        <option value="-1">请选择运营商</option>
        <option value="@telecom">中国电信</option>
        <option value="@cmcc">中国移动</option>
        <option value="@unicom">中国联通</option>
        <option value="">校园宽带</option>
      </select>
    </div>

    <div class="form-group">
      <label for="username">账号</label>
      <input type="text" id="username" placeholder="请输入学号" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="off">
    </div>

    <div class="button-group">
      <button id="loginBtn" class="btn btn-primary">登录</button>
      <button id="logoutBtn" class="btn btn-danger">注销</button>
    </div>

    <div class="footer">
      <a href="#" id="openSettings">设置</a>
      <a href="#" id="openHelp">使用帮助</a>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
